[project]
name = "ecsa"
version = "0.1.0"
description = "Earnings call sentiment analyzer"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "spacy>=3.8.18",
    "yfinance==1.8.0",  # pinned: unofficial API, breaks between releases
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecsa"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
mvp = [
    "plotly>=7.1.0",
    "streamlit>=1.67.0",
]
